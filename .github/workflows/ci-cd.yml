name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop, feature/* ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

  lint:
    needs: install-dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install ESLint
        run: |
          npm install -g eslint
          npm install -g eslint-plugin-react
          npm install -g eslint-config-airbnb

      - name: Lint Backend
        working-directory: ./backend
        run: |
          eslint . --max-warnings 0 --format json --output-file eslint-report.json
          test $(jq '.[] | select(.severity == 2) | length' eslint-report.json) -eq 0

      - name: Lint Frontend
        working-directory: ./frontend
        run: |
          eslint . --ext .js,.jsx --max-warnings 0 --format json --output-file eslint-report.json
          test $(jq '.[] | select(.severity == 2) | length' eslint-report.json) -eq 0

  test:
    needs: lint
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:6
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Backend Tests
        working-directory: ./backend
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://localhost:27017/test_db
          JWT_SECRET: test_secret
        run: |
          npm ci
          npm run test:coverage
          node scripts/generate-story-coverage.js

      - name: Generate Backend Test Report
        if: always()
        working-directory: ./backend
        run: |
          echo "## Backend Test Coverage Summary" >> $GITHUB_STEP_SUMMARY
          echo "### User Management & Security" >> $GITHUB_STEP_SUMMARY
          jq -r '.["src/controllers/auth.js"].lines.pct' coverage/coverage-summary.json | xargs -I {} echo "- Auth Controller: {}%" >> $GITHUB_STEP_SUMMARY
          jq -r '.["src/middlewares/auth.js"].lines.pct' coverage/coverage-summary.json | xargs -I {} echo "- Auth Middleware: {}%" >> $GITHUB_STEP_SUMMARY
          
          echo "### Room Management" >> $GITHUB_STEP_SUMMARY
          jq -r '.["src/controllers/rooms.js"].lines.pct' coverage/coverage-summary.json | xargs -I {} echo "- Room Controller: {}%" >> $GITHUB_STEP_SUMMARY
          
          echo "### Booking System" >> $GITHUB_STEP_SUMMARY
          jq -r '.["src/controllers/bookings.js"].lines.pct' coverage/coverage-summary.json | xargs -I {} echo "- Booking Controller: {}%" >> $GITHUB_STEP_SUMMARY

      - name: Frontend Tests
        working-directory: ./frontend
        run: |
          npm ci
          npm run test:coverage

      - name: Check Coverage Thresholds
        working-directory: ./backend
        run: |
          # Check overall coverage
          OVERALL_COVERAGE=$(jq '.total.lines.pct' coverage/coverage-summary.json)
          echo "Overall Coverage: $OVERALL_COVERAGE%"
          test $OVERALL_COVERAGE -ge 75

          # Check Auth coverage (80% threshold)
          AUTH_COVERAGE=$(jq '.["src/controllers/auth.js"].lines.pct' coverage/coverage-summary.json)
          echo "Auth Coverage: $AUTH_COVERAGE%"
          test $AUTH_COVERAGE -ge 80

          # Check Room Management coverage
          ROOM_COVERAGE=$(jq '.["src/controllers/rooms.js"].lines.pct' coverage/coverage-summary.json)
          echo "Room Management Coverage: $ROOM_COVERAGE%"
          test $ROOM_COVERAGE -ge 75

          # Check Booking coverage
          BOOKING_COVERAGE=$(jq '.["src/controllers/bookings.js"].lines.pct' coverage/coverage-summary.json)
          echo "Booking Coverage: $BOOKING_COVERAGE%"
          test $BOOKING_COVERAGE -ge 75

      - name: Upload Coverage Reports
        uses: actions/upload-artifact@v3
        with:
          name: coverage-reports
          path: |
            backend/coverage
            frontend/coverage

  security:
    needs: install-dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Security audit
        run: |
          echo "Running security checks..."
          
          # Run npm audit and save results
          npm audit --json > npm-audit.json || true
          
          # Check for critical and high severity issues
          CRITICAL_COUNT=$(jq '[.advisories[] | select(.severity == "critical")] | length' npm-audit.json)
          HIGH_COUNT=$(jq '[.advisories[] | select(.severity == "high")] | length' npm-audit.json)
          
          echo "Security Issues Found:"
          echo "Critical: $CRITICAL_COUNT"
          echo "High: $HIGH_COUNT"
          
          # Fail if there are any critical vulnerabilities
          if [ "$CRITICAL_COUNT" -gt 0 ]; then
            echo "❌ Found $CRITICAL_COUNT critical vulnerabilities!"
            echo "Critical security issues must be fixed before proceeding."
            exit 1
          fi
          
          # Warn about high severity issues
          if [ "$HIGH_COUNT" -gt 0 ]; then
            echo "⚠️ Found $HIGH_COUNT high severity vulnerabilities!"
            echo "Please review and address these issues soon."
          fi
          
          # Install and run snyk if token is available
          if [ -n "$SNYK_TOKEN" ]; then
            npm install -g snyk
            snyk test --severity-threshold=medium || true
          fi

      - name: Run SNYK Security Scan
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=medium

  build:
    needs: [test, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Build Backend
        working-directory: ./backend
        run: |
          npm ci
          npm run build

      - name: Build Frontend
        working-directory: ./frontend
        run: |
          npm ci
          npm run build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: build-artifacts
          path: |
            backend/dist
            frontend/dist
