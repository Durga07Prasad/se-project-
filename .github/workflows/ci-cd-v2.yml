name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop, feature/* ]
  pull_request:
    branches: [ main, develop ]

jobs:
  install-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: |
          npm ci
          npm run build --if-present

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: |
          npm ci
          npm run build --if-present

  lint:
    needs: install-dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install Dependencies
        run: |
          cd backend && npm ci
          cd ../frontend && npm ci

      - name: Lint Backend
        working-directory: ./backend
        run: |
          npm run lint || exit 1

      - name: Lint Frontend
        working-directory: ./frontend
        run: |
          npm run lint || exit 1

  test:
    needs: lint
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:6
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install Dependencies
        run: |
          cd backend && npm ci
          cd ../frontend && npm ci

      - name: Backend Tests
        working-directory: ./backend
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://localhost:27017/test_db
          JWT_SECRET: test_secret
        run: |
          npm run test:coverage
          node scripts/generate-story-coverage.js

      - name: Generate Backend Test Report
        if: always()
        working-directory: ./backend
        run: |
          echo "## Backend Test Coverage Summary" >> $GITHUB_STEP_SUMMARY
          echo "### User Management & Security" >> $GITHUB_STEP_SUMMARY
          jq -r '.["src/controllers/auth.js"].lines.pct' coverage/coverage-summary.json | xargs -I {} echo "- Auth Controller: {}%" >> $GITHUB_STEP_SUMMARY
          
          echo "### Room Management" >> $GITHUB_STEP_SUMMARY
          jq -r '.["src/controllers/rooms.js"].lines.pct' coverage/coverage-summary.json | xargs -I {} echo "- Room Controller: {}%" >> $GITHUB_STEP_SUMMARY
          
          echo "### Booking System" >> $GITHUB_STEP_SUMMARY
          jq -r '.["src/controllers/bookings.js"].lines.pct' coverage/coverage-summary.json | xargs -I {} echo "- Booking Controller: {}%" >> $GITHUB_STEP_SUMMARY

      - name: Frontend Tests
        working-directory: ./frontend
        run: |
          npm run test:coverage
          node scripts/generate-story-coverage.js

      - name: Generate Frontend Test Report
        if: always()
        working-directory: ./frontend
        run: |
          echo "## Frontend Test Coverage Summary" >> $GITHUB_STEP_SUMMARY
          echo "### Auth Components" >> $GITHUB_STEP_SUMMARY
          jq -r '.["src/pages/Auth/Login.jsx"].lines.pct' coverage/coverage-summary.json | xargs -I {} echo "- Login: {}%" >> $GITHUB_STEP_SUMMARY
          jq -r '.["src/pages/Auth/Register.jsx"].lines.pct' coverage/coverage-summary.json | xargs -I {} echo "- Register: {}%" >> $GITHUB_STEP_SUMMARY

          echo "### Room Components" >> $GITHUB_STEP_SUMMARY
          jq -r '.["src/pages/Rooms/RoomList.jsx"].lines.pct' coverage/coverage-summary.json | xargs -I {} echo "- Room List: {}%" >> $GITHUB_STEP_SUMMARY
          jq -r '.["src/pages/Rooms/RoomDetails.jsx"].lines.pct' coverage/coverage-summary.json | xargs -I {} echo "- Room Details: {}%" >> $GITHUB_STEP_SUMMARY

      - name: Check Coverage Thresholds
        working-directory: ./backend
        run: |
          # Check overall coverage
          OVERALL_COVERAGE=$(jq '.total.lines.pct' coverage/coverage-summary.json)
          echo "Overall Backend Coverage: $OVERALL_COVERAGE%"
          test $OVERALL_COVERAGE -ge 75

          # Check Auth coverage (80% threshold)
          AUTH_COVERAGE=$(jq '.["src/controllers/auth.js"].lines.pct' coverage/coverage-summary.json)
          echo "Auth Coverage: $AUTH_COVERAGE%"
          test $AUTH_COVERAGE -ge 80

      - name: Upload Coverage Reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            backend/coverage
            frontend/coverage

  security:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install Dependencies
        run: |
          cd backend && npm ci
          cd ../frontend && npm ci

      - name: Run npm audit (Backend)
        working-directory: ./backend
        run: npm audit --audit-level=moderate || true

      - name: Run npm audit (Frontend)
        working-directory: ./frontend
        run: npm audit --audit-level=moderate || true

  build:
    needs: [test, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install Dependencies
        run: |
          cd backend && npm ci
          cd ../frontend && npm ci

      - name: Build Backend
        working-directory: ./backend
        run: npm run build --if-present

      - name: Build Frontend
        working-directory: ./frontend
        run: npm run build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            backend/dist
            frontend/dist